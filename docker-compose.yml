
services:
  db:
    image: postgres:16

    container_name: agentic_soc_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_soc

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_soc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: